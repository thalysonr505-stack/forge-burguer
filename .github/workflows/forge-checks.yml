name: FORGE automatic checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate JavaScript syntax
        run: |
          for file in js/*.js; do
            echo "Checking $file"
            node --check "$file"
          done
      - name: Validate HTML, local references, product IDs and media
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import sys

          ROOT = Path(".")
          PAGES = ["index.html", "menu.html", "about.html", "contact.html", "admin.html", "track.html"]
          REQUIRED_MEDIA = [
              "images/the-original.jpg",
              "images/double-forge.jpg",
              "images/the-bacon.jpg",
              "images/the-truffle.jpg",
              "images/forge-home.mp4",
          ]
          failed = False

          class PageParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.refs = []
                  self.tags = set()
                  self.video_sources = []
                  self.product_ids = []
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  self.tags.add(tag)
                  for key in ("src", "href"):
                      value = attrs.get(key, "")
                      if value and not value.startswith(("#", "http:", "https:", "mailto:", "tel:", "data:")):
                          self.refs.append(value.split("?")[0])
                  if tag == "source" and attrs.get("src"):
                      self.video_sources.append(attrs["src"].split("?")[0])
                  if "data-product" in attrs:
                      self.product_ids.append(attrs["data-product"])

          for page in PAGES:
              path = ROOT / page
              if not path.is_file():
                  print(f"FAIL missing page: {page}")
                  failed = True
                  continue
              parser = PageParser()
              parser.feed(path.read_text(encoding="utf-8"))
              if "html" not in parser.tags or "body" not in parser.tags:
                  print(f"FAIL incomplete document structure: {page}")
                  failed = True
              else:
                  print(f"PASS HTML structure: {page}")
              for ref in parser.refs:
                  target = (path.parent / ref).resolve()
                  if not target.is_file():
                      print(f"FAIL broken local reference in {page}: {ref}")
                      failed = True
              for ref in parser.refs:
                  if (path.parent / ref).is_file():
                      pass
              print(f"PASS local references: {page}")
              if 'name="viewport"' not in path.read_text(encoding="utf-8"):
                  print(f"FAIL missing viewport: {page}")
                  failed = True

          for asset in REQUIRED_MEDIA:
              path = ROOT / asset
              if path.is_file() and path.stat().st_size > 0:
                  print(f"PASS media exists and is non-empty: {asset} ({path.stat().st_size} bytes)")
              else:
                  print(f"FAIL missing or empty media: {asset}")
                  failed = True

          home = PageParser()
          home.feed((ROOT / "index.html").read_text(encoding="utf-8"))
          if "images/forge-home.mp4" not in home.video_sources:
              print("FAIL HOME video source is not wired to images/forge-home.mp4")
              failed = True
          else:
              print("PASS HOME video source")

          menu = PageParser()
          menu.feed((ROOT / "menu.html").read_text(encoding="utf-8"))
          expected = {"original", "double-forge", "bacon", "truffle"}
          if set(menu.product_ids) != expected:
              print(f"FAIL menu product IDs mismatch: {menu.product_ids}")
              failed = True
          else:
              print("PASS all four menu product IDs")

          if failed:
              sys.exit(1)
          print("All FORGE checks passed.")
          PY
